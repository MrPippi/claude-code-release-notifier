[project]
name = "claude-code-release-notifier"
version = "2.0.0"
description = "Translate anthropics/claude-code release notes with Claude and post them to Discord."
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Full-width punctuation is intentional in Traditional Chinese text.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["notifier"]
branch = true

[tool.ruff.lint.per-file-ignores]
# Prompt and label text keeps its natural line breaks.
"notifier/prompts.py" = ["E501"]
"notifier/locales.py" = ["E501"]

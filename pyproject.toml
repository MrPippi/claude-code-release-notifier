[project]
name = "claude-code-release-notifier"
version = "2.0.0"
description = "Translate anthropics/claude-code release notes with Claude and post them to Discord."
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["notifier"]
branch = true
